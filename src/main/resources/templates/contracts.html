<!DOCTYPE html>
<html lang="vi" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Hợp Đồng - Meani Real Estate</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/js/darkmode.js"></script>
    <script src="/js/pagination.js"></script>
    <script src="/js/search-utils.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="symbol-m">M</span><span class="text-rest">eani</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-item">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="/properties" class="nav-item">
                    <span class="icon">🏠</span>
                    <span>BĐS</span>
                </a>
                <a href="/contracts" class="nav-item active">
                    <span class="icon">📜</span>
                    <span>Hợp đồng</span>
                </a>
                <a href="/payments" class="nav-item">
                    <span class="icon">💰</span>
                    <span>Thanh toán</span>
                </a>
                <a href="/tenants" class="nav-item">
                    <span class="icon">👥</span>
                    <span>Khách thuê</span>
                </a>
                <a href="/owners" class="nav-item">
                    <span class="icon">👤</span>
                    <span>Chủ sở hữu</span>
                </a>
                <a href="/staff" class="nav-item" sec:authorize="hasAnyRole('Admin', 'Quản lý')">                    <span class="icon">👨‍💼</span>
                    <span>Nhân viên</span>
                </a>
                <a href="/accounts" class="nav-item" sec:authorize="hasRole('Admin')">
                    <span class="icon">🔐‍</span>
                    <span>Tài khoản</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <h1>Quản lý Hợp Đồng</h1>
                <div class="user-section">
                    <button class="btn-primary" id="addContractBtn">+ Thêm Hợp Đồng</button>
                    <a href="/" class="btn-logout">Đăng xuất</a>
                </div>
            </div>

            <!-- Content -->
            <div class="dashboard-content">
                <!-- Search & Filter -->
                <div class="search-filter">
                    <input type="text" id="searchInput" placeholder="Tìm kiếm theo ID hoặc khách thuê...">
                    <select id="filterStatus">
                        <option value="">-- Tất cả trạng thái --</option>
                        <option value="Hiệu lực">Hiệu lực</option>
                        <option value="Kết thúc">Kết thúc</option>
                        <option value="Chờ duyệt">Chờ duyệt</option>
                    </select>
                </div>

                <!-- Contracts Table -->
                <div class="table-card">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>BĐS</th>
                                <th>Khách thuê</th>
                                <th>Ngày bắt đầu</th>
                                <th>Ngày kết thúc</th>
                                <th>Tiền cọc</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="contractsTable">
                            <tr>
                                <td colspan="8" style="text-align: center; color: #999;">Đang tải...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="pagination-container">
                    <div class="pagination-buttons" id="paginationButtons">
                        <!-- Được tạo bởi JavaScript -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Thêm/Sửa Hợp Đồng -->
    <div id="contractModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Thêm Hợp Đồng</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <form id="contractForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>BĐS:</label>
                        <select id="batDongSan" required>
                            <option>-- Chọn BĐS --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Khách thuê:</label>
                        <select id="khachThue" required>
                            <option>-- Chọn khách thuê --</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Ngày bắt đầu:</label>
                        <input type="date" id="ngayBatDau" required>
                    </div>
                    <div class="form-group">
                        <label>Ngày kết thúc:</label>
                        <input type="date" id="ngayKetThuc" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tiền cọc (đ):</label>
                        <input type="number" id="tienCoc" required>
                    </div>
                    <div class="form-group">
                        <label>Trạng thái:</label>
                        <select id="trangThai" required>
                            <option>Hiệu lực</option>
                            <option>Kết thúc</option>
                            <option>Chờ duyệt</option>
                        </select>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="cancelBtn">Hủy</button>
                    <button type="submit" class="btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/contracts.js"></script>
</body>
</html>
